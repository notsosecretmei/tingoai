<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Rounded squircle container with rich dark espresso background -->
  <rect width="64" height="64" rx="16" fill="#241812"/>
  
  <!-- Classical serif top bar of the T -->
  <path d="M14 18.5 V 14.5 Q 14 13.5 15 13.5 H 49 Q 50 13.5 50 14.5 V 18.5" 
        stroke="#F6EFE6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center stem connecting seamlessly down to the microphone capsule -->
  <line x1="32" y1="14" x2="32" y2="28" stroke="#F6EFE6" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Microphone capsule body with smooth pill shape -->
  <rect x="25" y="27" width="14" height="23" rx="7" stroke="#F6EFE6" stroke-width="2.5" fill="#241812"/>
  
  <!-- Microphone grille lines (crisp, clean horizontal slots) -->
  <line x1="28.5" y1="34" x2="35.5" y2="34" stroke="#F6EFE6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="28.5" y1="38.5" x2="35.5" y2="38.5" stroke="#F6EFE6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="28.5" y1="43" x2="35.5" y2="43" stroke="#F6EFE6" stroke-width="1.6" stroke-linecap="round"/>
  
  <!-- Left sound waves: concentric acoustic arcs -->
  <path d="M19.5 32.5 A 8 8 0 0 0 19.5 44.5" stroke="#F6EFE6" stroke-width="2" stroke-linecap="round"/>
  <path d="M13.5 28 A 14.5 14.5 0 0 0 13.5 49" stroke="#DCBA8E" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Right sound waves: concentric acoustic arcs -->
  <path d="M44.5 32.5 A 8 8 0 0 1 44.5 44.5" stroke="#F6EFE6" stroke-width="2" stroke-linecap="round"/>
  <path d="M50.5 28 A 14.5 14.5 0 0 1 50.5 49" stroke="#DCBA8E" stroke-width="2" stroke-linecap="round"/>
</svg>
